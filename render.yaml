services:
  - type: web
    name: backtest-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # EMS live trading bot (V3, Hyperliquid). Background worker, no HTTP port.
  # Secrets (HL_*) are set in the Render dashboard, NOT committed (sync: false).
  - type: worker
    name: ems-live-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m ems_live.run
    disk:
      name: ems-state
      mountPath: /data            # persists position + day-ledger across deploys
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONUNBUFFERED
        value: "1"                # stream print() to Render logs live (no buffering)
      - key: HL_TESTNET
        value: "true"             # flip to "false" only for mainnet
      - key: EMS_DRY_RUN
        value: "true"             # SAFE: compute+log, no orders. Flip to "false" to ARM.
      - key: EMS_RISK_USD
        value: "20"
      - key: EMS_MAX_DAILY_LOSSES
        value: "10"               # halt after 10 losing trades in a UTC day
      - key: EMS_MAX_DAILY_LOSS_R
        value: "0"                # R-based cap off (count-based is primary)
      - key: EMS_STATUS_MODE
        value: "steps"            # H4→H1→M30 ladder + daily heartbeat (step-by-step)
      # --- sizing / leverage (equity-relative auto-leverage; per-venue tunable) ---
      - key: EMS_MAX_LEVERAGE
        value: "0"                # 0 = use the coin's exchange max
      - key: EMS_MARGIN_BUFFER_FRAC
        value: "0.90"             # use at most 90% of equity as margin
      - key: EMS_LIQ_SAFETY_MULT
        value: "1.5"              # liquidation must sit >= 1.5x the stop distance beyond entry
      - key: EMS_MAX_RISK_BAND_PCT
        value: "15"               # skip signals whose structural stop is wider than this %
      - key: EMS_MIN_RISK_PCT
        value: "0.1"
      - key: EMS_SLIPPAGE
        value: "0.01"             # market-order slippage bound
      - key: EMS_HL_MIN_NOTIONAL
        value: "10"
      - key: EMS_MAX_NOTIONAL_USD
        value: "0"                # optional absolute ceiling; 0 = OFF (margin-fit governs)
      - key: EMS_STATE_PATH
        value: /data/ems_live_state.json
      - key: HL_MASTER_ADDRESS
        sync: false               # set in dashboard
      - key: HL_AGENT_KEY
        sync: false               # SECRET — set in dashboard, never commit
      # --- monitoring (optional; each no-ops if unset) ---
      - key: TELEGRAM_BOT_TOKEN
        sync: false               # from @BotFather
      - key: TELEGRAM_CHAT_ID
        sync: false               # your chat/channel id
      - key: HEALTHCHECK_URL
        sync: false               # healthchecks.io ping URL (dead-man's switch)
